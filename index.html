<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch Web Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-900 to-blue-900 min-h-screen flex items-center justify-center text-white p-4">

    <div class="w-full max-w-md mx-auto bg-white/20 backdrop-blur-xl rounded-2xl p-6 md:p-8 shadow-2xl border border-white/30">
        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Stopwatch</h1>
            <p class="text-blue-200 mt-1">Measure time with precision.</p>
        </div>

        <!-- Timer Display -->
        <div id="timer-display" class="text-4xl md:text-5xl font-mono font-bold text-center py-6 bg-black/20 rounded-lg mb-6 tracking-wider">
            00:00:00.00
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">Start</button>
            <button id="pause-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">Pause</button>
            <button id="reset-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">Reset</button>
            <button id="lap-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">Lap</button>
        </div>

        <!-- Lap Times -->
        <div id="laps-container" class="max-h-60 overflow-y-auto pr-2 mt-6">
            <h2 class="text-xl font-semibold mb-3 sticky top-0 bg-white/20 backdrop-blur-xl py-2 text-center">Lap Times</h2>
            <ul id="laps-list" class="space-y-2">
                <!-- Lap times will be inserted here -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
